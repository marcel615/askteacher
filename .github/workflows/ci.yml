name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build Spring Boot
        run: ./gradlew test bootJar
      - name: Verify JaCoCo report
        run: test -s build/reports/jacoco/test/jacocoTestReport.xml
      - name: Store JAR and coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend
          if-no-files-found: error
          path: |
            backend/build/libs/*.jar
            backend/build/reports/jacoco/test/jacocoTestReport.xml
      - name: Check Codecov token availability
        id: codecov
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload coverage to Codecov
        if: steps.codecov.outputs.enabled == 'true'
        uses: codecov/codecov-action@v7
        with:
          files: backend/build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Store web build
        uses: actions/upload-artifact@v7
        with:
          name: frontend
          if-no-files-found: error
          path: frontend/dist/
