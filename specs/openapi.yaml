        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
  parameters:
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: /api/auth/csrf에서 받은 token. CSRF 쿠키도 함께 전송한다.
      schema:
        type: string
  responses:
    BadRequest:
      description: Validation 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TokenResponse:
      description: 성공. refreshToken HttpOnly 쿠키를 설정한다. 쿠키 경로는 /api/auth다.
      content:
        application/json:
          schema:
            type: object
            properties:
              accessToken:
                type: string
              tokenType:
                type: string
              expiresIn:
                type: integer
          example:
            accessToken: eyJ...
            tokenType: Bearer
            expiresIn: 900
      headers:
        Set-Cookie:
          description: refreshToken HttpOnly 쿠키; 경로 /api/auth. 운영 시 Secure.
          schema:
            type: string
  schemas:
    Error:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
      example:
        status: 400
        message: 에러 메시지
