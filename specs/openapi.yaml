  /api/posts/{postId}/comments:
    post:
      summary: 댓글 작성
      description: "### Request\r\n\r\n`POST /api/posts/{postId}/comments`\r\n\r\n```http\r\nAuthorization: Bearer {accessToken}\r\nContent-Type: application/json\r\n```\r\n\r\n```json\r\n{\r\n  \"content\": \"댓글 내용\"\r\n}\r\n```\r\n\r\n댓글 작성자 ID는 request body로 받지 않고 Access Token의 사용자 ID를 사용한다.\r\n\r\n### Validation\r\n\r\n| 필드 | 규칙 |\r\n|---|---|\r\n| postId | 필수, 존재하고 삭제되지 않은 게시글 ID |\r\n| content | 필수, 공백만 입력 불가, 최대 1000자 |\r\n\r\n`content`는 저장 전에 앞뒤 공백을 제거한다.\r\n\r\n### Response\r\n\r\n```json\r\n{\r\n  \"commentId\": 1,\r\n  \"postId\": 1,\r\n  \"writerId\": 1,\r\n  \"writerNickname\": \"springUser\",\r\n  \"content\": \"댓글 내용\",\r\n  \"likeCount\": 0,\r\n  \"likedByMe\": false,\r\n  \"createdAt\": \"2026-09-16T12:00:00\",\r\n  \"updatedAt\": \"2026-09-16T12:00:00\"\r\n}\r\n```\r\n\r\n### Status Code\r\n\r\n| 상황 | Status |\r\n|---|---|\r\n| 생성 성공 | 201 Created |\r\n| 인증 실패 | 401 Unauthorized |\r\n| Validation 실패 | 400 Bad Request |\r\n| 사용자 없음 | 404 Not Found |\r\n| 게시글 없음 | 404 Not Found |\r\n\r\n---"
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  commentId:
                    type: integer
                  postId:
                    type: integer
                  writerId:
                    type: integer
                  writerNickname:
                    type: string
                  content:
                    type: string
                  likeCount:
                    type: integer
                  likedByMe:
                    type: boolean
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
              example:
                commentId: 1
                postId: 1
                writerId: 1
                writerNickname: springUser
                content: 댓글 내용
                likeCount: 0
                likedByMe: false
                createdAt: '2026-09-16T12:00:00'
                updatedAt: '2026-09-16T12:00:00'
        '400':
          description: Validation 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 사용자 없음; 게시글 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - name: postId
          in: path
          required: true
          description: 존재하고 삭제되지 않은 대상 ID. 상세 규칙은 본문 참고.
          schema:
            type: integer
            format: int64
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  maxLength: 1000
                  description: 필수, 공백만 입력 불가. 저장 전 앞뒤 공백 제거.
            example:
              content: 댓글 내용
    get:
      summary: 댓글 목록 조회
      description: "### Request\r\n\r\n`GET /api/posts/{postId}/comments`\r\n\r\n인증 없이 조회할 수 있다. 유효한 Access Token을 함께 보내면 현재 사용자의 댓글 좋아요 여부를 반환한다.\r\n\r\n### Query Parameters\r\n\r\n| 이름 | 타입 | 필수 | 설명 |\r\n|---|---|---|---|\r\n| page | int | 선택 | 페이지 번호. 0 이상. 기본값 0 |\r\n| size | int | 선택 | 페이지 크기. 1 이상 100 이하. 기본값 20 |\r\n| sort | String | 선택 | `latest` 또는 `likeCount`. 기본값 `latest` |\r\n\r\n### Request Examples\r\n\r\n```http\r\nGET /api/posts/1/comments?page=0&size=20&sort=latest\r\nGET /api/posts/1/comments?page=0&size=20&sort=likeCount\r\n```\r\n\r\n### Response\r\n\r\n```json\r\n{\r\n  \"comments\": [\r\n    {\r\n      \"commentId\": 1,\r\n      \"postId\": 1,\r\n      \"writerId\": 1,\r\n      \"writerNickname\": \"springUser\",\r\n      \"content\": \"댓글 내용\",\r\n      \"likeCount\": 3,\r\n      \"likedByMe\": false,\r\n      \"createdAt\": \"2026-09-16T12:00:00\",\r\n      \"updatedAt\": \"2026-09-16T12:00:00\"\r\n    }\r\n  ],\r\n  \"page\": 0,\r\n  \"size\": 20,\r\n  \"totalElements\": 1,\r\n  \"totalPages\": 1,\r\n  \"hasNext\": false,\r\n  \"sort\": \"latest\"\r\n}\r\n```\r\n\r\n### Status Code\r\n\r\n| 상황 | Status |\r\n|---|---|\r\n| 조회 성공 | 200 OK |\r\n| page가 0 미만 | 400 Bad Request |\r\n| size가 1 미만 또는 100 초과 | 400 Bad Request |\r\n| 허용되지 않은 sort | 400 Bad Request |\r\n| 게시글 없음 | 404 Not Found |\r\n\r\n### 비고\r\n\r\n- 삭제된 댓글은 조회하지 않는다.\r\n- 비로그인 사용자의 `likedByMe`는 `false`다.\r\n- 로그인 사용자는 실제 댓글 좋아요 여부를 `likedByMe`로 반환한다.\r\n- `latest`는 `createdAt DESC`, `commentId DESC` 순서로 정렬한다.\r\n- `likeCount`는 `likeCount DESC`, `createdAt DESC`, `commentId DESC` 순서로 정렬한다.\r\n- 댓글 좋아요 수는 `comment_likes` 데이터를 집계하여 반환한다.\r\n\r\n---"
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      type: object
                      properties:
                        commentId:
                          type: integer
                        postId:
                          type: integer
                        writerId:
                          type: integer
                        writerNickname:
                          type: string
                        content:
                          type: string
                        likeCount:
                          type: integer
                        likedByMe:
                          type: boolean
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                  page:
                    type: integer
                  size:
                    type: integer
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
                  hasNext:
                    type: boolean
                  sort:
                    type: string
              example:
                comments:
                  - commentId: 1
                    postId: 1
                    writerId: 1
                    writerNickname: springUser
                    content: 댓글 내용
                    likeCount: 3
                    likedByMe: false
                    createdAt: '2026-09-16T12:00:00'
                    updatedAt: '2026-09-16T12:00:00'
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
                hasNext: false
                sort: latest
        '400':
          description: page가 0 미만; size가 1 미만 또는 100 초과; 허용되지 않은 sort
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 게시글 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - name: postId
          in: path
          required: true
          description: 존재하고 삭제되지 않은 대상 ID. 상세 규칙은 본문 참고.
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - latest
              - likeCount
            default: latest
      security:
        - {}
        - bearerAuth: []
