openapi: 3.0.3
info:
  title: Ask-Teacher API
  version: '1.0'
  description: >-
    공식 API 명세다. 인증 정책은 auth-policy.md를 참고한다. 예시에서 유추한 응답 스키마는 필드 필수 여부를 확정하지 않는다.
paths:
  /api/auth/signup:
    post:
      summary: 회원가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - nickname
              properties:
                email:
                  type: string
                  format: email
                  description: 중복 불가
                password:
                  type: string
                  minLength: 8
                nickname:
                  type: string
                  minLength: 2
                  maxLength: 20
                  description: 중복 불가
            example:
              email: user@example.com
              password: password123
              nickname: springUser
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: integer
                  email:
                    type: string
                  nickname:
                    type: string
              example:
                userId: 1
                email: user@example.com
                nickname: springUser
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 이메일 또는 닉네임 중복
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/login:
    post:
      summary: 로그인
      description: CSRF 쿠키와 X-XSRF-TOKEN 헤더를 보낸다. 성공 시 Refresh 쿠키를 발급한다.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
            example:
              email: user@example.com
              password: password123
      responses:
        '200':
          $ref: '#/components/responses/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 로그인 정보 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: CSRF 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Redis 장애
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/csrf:
    get:
      summary: CSRF 토큰 발급
      description: 응답 token과 headerName 및 HttpOnly CSRF 쿠키를 발급한다.
      responses:
        '200':
          description: CSRF 토큰 발급 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  headerName:
                    type: string
          headers:
            Set-Cookie:
              description: 'HttpOnly CSRF 쿠키: 보안 환경 __Host-XSRF-TOKEN, 비보안 개발 환경 XSRF-TOKEN.'
              schema:
                type: string
  /api/auth/refresh:
    post:
      summary: 토큰 재발급
      description: >-
        본문 없이 Refresh 쿠키와 CSRF 쿠키 및 헤더를 보낸다. 성공 시 로그인과 같은 JSON과 회전된 쿠키를 반환한다.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      security:
        - refreshCookie: []
      responses:
        '401':
          description: 만료·위조·폐기·재사용
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: CSRF 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Redis 장애
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          $ref: '#/components/responses/TokenResponse'
  /api/auth/logout:
    post:
      summary: 로그아웃
      description: 유효한 Access Token 또는 Refresh 쿠키로 현재 세션을 식별한다. 인증 정보는 선택이며 CSRF 쿠키와 헤더를 보낸다. Refresh 쿠키를 지운다.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      security:
        - {}
        - bearerAuth: []
        - refreshCookie: []
      responses:
        '204':
          description: 로그아웃 성공 또는 이미 만료·로그아웃 상태
          headers:
            Set-Cookie:
              description: refreshToken 쿠키를 지운다.
              schema:
                type: string
        '403':
          description: CSRF 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Redis 장애
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/categories:
    get:
      summary: 카테고리 목록 조회
      description: "구현됨.\n\n### Request\r\n\r\n`GET /api/categories`\r\n\r\n### Response\r\n\r\n```json\r\n[\r\n  {\r\n    \"id\": 1,\r\n    \"name\": \"Spring\"\r\n  }\r\n]\r\n```\r\n\r\n### Status Code\r\n\r\n| 상황 | Status |\r\n|---|---|\r\n| 성공 | 200 OK |\r\n\r\n---"
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
              example:
                - id: 1
                  name: Spring
  /api/posts:
    post:
      summary: 게시글 작성
      description: "구현됨.\n\n### Request\r\n\r\n`POST /api/posts`\r\n\r\n```http\r\nAuthorization: Bearer {accessToken}\r\nContent-Type: multipart/form-data\r\n```\r\n\r\n| Part | 타입 | 필수 | 설명 |\r\n|---|---|---|---|\r\n| categoryId | Long | 필수 | 카테고리 ID |\r\n| title | String | 필수 | 게시글 제목 |\r\n| content | String | 필수 | 게시글 내용 |\r\n| files | MultipartFile[] | 선택 | 첨부파일 목록 |\r\n\r\n### Validation\r\n\r\n| 필드 | 규칙 |\r\n|---|---|\r\n| categoryId | 필수, 존재하는 카테고리 ID |\r\n| title | 필수, 100자 이하 |\r\n| content | 필수, 5000자 이하 |\r\n| files | 선택, 여러 파일 첨부 가능 |\r\n| files.contentType | `image/jpeg`, `image/png`, `image/webp`, `application/pdf`만 허용 |\r\n| files.size | 0보다 커야 하며 설정된 최대 크기 이하여야 함 |\r\n\r\n### Response\r\n\r\n```json\r\n{\r\n  \"postId\": 1,\r\n  \"title\": \"Spring Bean이 뭔가요?\",\r\n  \"newPost\": true,\r\n  \"createdAt\": \"2026-05-12T19:30:00\"\r\n}\r\n```\r\n\r\n### Status Code\r\n\r\n| 상황 | Status |\r\n|---|---|\r\n| 생성 성공 | 201 Created |\r\n| 인증 실패 | 401 Unauthorized |\r\n| Validation 실패 | 400 Bad Request |\r\n| 허용되지 않은 파일 형식 | 400 Bad Request |\r\n| 빈 파일 | 400 Bad Request |\r\n| 파일 크기 초과 | 400 Bad Request |\r\n| 사용자 없음 | 404 Not Found |\r\n| 카테고리 없음 | 404 Not Found |\r\n| 파일 저장 실패 | 500 Internal Server Error |\r\n\r\n첨부 저장이나 DB 트랜잭션이 롤백되면 이 요청에서 생성한 파일과 부분 파일을 정리한다. 기존 파일은 보존한다. 정리에 실패하거나 트랜잭션 결과를 알 수 없는 경우 파일이 남을 수 있다.\r\n\r\n---"
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  postId:
                    type: integer
                  title:
                    type: string
                  newPost:
                    type: boolean
                  createdAt:
                    type: string
              example:
                postId: 1
                title: Spring Bean이 뭔가요?
                newPost: true
                createdAt: '2026-05-12T19:30:00'
        '400':
          description: Validation 실패; 허용되지 않은 파일 형식; 빈 파일; 파일 크기 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 사용자 없음; 카테고리 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 파일 저장 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - categoryId
                - title
                - content
              properties:
                categoryId:
                  type: integer
                  format: int64
                  description: 존재하는 카테고리 ID
                title:
                  type: string
                  maxLength: 100
                content:
                  type: string
                  maxLength: 5000
                files:
                  type: array
                  description: >-
                    선택, 파일은 0보다 크고 설정된 최대 크기 이하. image/jpeg, image/png, image/webp, application/pdf만
                    허용.
                  items:
                    type: string
                    format: binary
    get:
      summary: 게시글 목록 조회
      description: "구현됨.\n\n### Request\r\n\r\n`GET /api/posts`\r\n\r\n### Query Parameters\r\n\r\n| 이름 | 타입 | 필수 | 설명 |\r\n|---|---|---|---|\r\n| keyword | String | 선택 | 제목 또는 내용 검색어. 없거나 공백이면 검색 조건 없이 조회 |\r\n| categoryId | Long | 선택 | 카테고리 ID. 없으면 전체 카테고리 조회 |\r\n| page | int | 선택 | 페이지 번호. 0 이상. 기본값 0 |\r\n| size | int | 선택 | 페이지 크기. 1 이상. 기본값 10 |\r\n\r\n### Request Examples\r\n\r\n```http\r\nGET /api/posts?page=0&size=10\r\nGET /api/posts?keyword=검색어&page=0&size=10\r\nGET /api/posts?categoryId=1&page=0&size=10\r\nGET /api/posts?keyword=검색어&categoryId=1&page=0&size=10\r\n```\r\n\r\n### Response\r\n\r\n```json\r\n{\r\n  \"content\": [\r\n    {\r\n      \"postId\": 1,\r\n      \"title\": \"Spring Bean이 뭔가요?\",\r\n      \"writerNickname\": \"springUser\",\r\n      \"categoryName\": \"Spring\",\r\n      \"newPost\": true,\r\n      \"likeCount\": 3,\r\n      \"createdAt\": \"2026-05-12T19:30:00\"\r\n    }\r\n  ],\r\n  \"currentPage\": 0,\r\n  \"pageSize\": 10,\r\n  \"totalElements\": 1,\r\n  \"totalPages\": 1,\r\n  \"hasNext\": false,\r\n  \"hasPrevious\": false,\r\n  \"isFirst\": true,\r\n  \"isLast\": true\r\n}\r\n```\r\n\r\n### Status Code\r\n\r\n| 상황 | Status |\r\n|---|---|\r\n| 조회 성공 | 200 OK |\r\n| page가 0 미만 | 400 Bad Request |\r\n| size가 1 미만 | 400 Bad Request |\r\n| 존재하지 않는 categoryId | 404 Not Found |\r\n| 서버 조회 실패 | 500 Internal Server Error |\r\n\r\n### 비고\r\n\r\n- `keyword`가 없거나 공백이면 검색 조건 없이 조회한다.\r\n- `categoryId`가 없으면 전체 카테고리 게시글을 조회한다.\r\n- 삭제된 게시글은 목록에서 제외한다.\r\n- 게시글 목록은 `createdAt` 기준 내림차순으로 정렬해 최근에 생성된 게시글부터 반환한다.\r\n\r\n---"
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        postId:
                          type: integer
                        title:
                          type: string
                        writerNickname:
                          type: string
                        categoryName:
                          type: string
                        newPost:
                          type: boolean
                        likeCount:
                          type: integer
                        createdAt:
                          type: string
                  currentPage:
                    type: integer
                  pageSize:
                    type: integer
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
                  hasNext:
                    type: boolean
                  hasPrevious:
                    type: boolean
                  isFirst:
                    type: boolean
                  isLast:
                    type: boolean
              example:
                content:
                  - postId: 1
                    title: Spring Bean이 뭔가요?
                    writerNickname: springUser
                    categoryName: Spring
                    newPost: true
                    likeCount: 3
                    createdAt: '2026-05-12T19:30:00'
                currentPage: 0
                pageSize: 10
                totalElements: 1
                totalPages: 1
                hasNext: false
                hasPrevious: false
                isFirst: true
                isLast: true
        '400':
          description: page가 0 미만; size가 1 미만
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 존재하지 않는 categoryId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 서버 조회 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          description: 제목 또는 내용 검색어. 없거나 공백이면 검색 조건 없음.
        - name: categoryId
          in: query
          schema:
            type: integer
            format: int64
          description: 없으면 전체 카테고리
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            default: 10
  /api/posts/{postId}:
    get:
      summary: 게시글 상세 조회
      description: |-
        인증 없이 게시글을 조회할 수 있다. 유효한 Bearer 토큰을 보내면 현재 사용자 기준 값을 반환한다.
        성공 응답의 필수 불리언 isAuthor는 유효하게 인증된 작성자만 true이며, 비작성자와 비로그인은 false다.
        isAuthor는 화면 표시 정보이며 수정·삭제 요청의 서버 인가를 대체하지 않는다.
        만료·유효하지 않은 Bearer 토큰은 401, 인증 서비스 장애는 503을 반환한다.
        응답의 Cache-Control에는 no-store를 포함한다.
      responses:
        '200':
          description: 조회 성공
          headers:
            Cache-Control:
              description: no-store를 포함해야 한다. 다른 캐시 지시어를 함께 사용할 수 있다.
              schema:
                type: string
              example: no-cache, no-store, max-age=0, must-revalidate
          content:
            application/json:
              schema:
                type: object
                required:
                  - isAuthor
                properties:
                  postId:
                    type: integer
                  userName:
                    type: string
                  categoryName:
                    type: string
                  title:
                    type: string
                  content:
                    type: string
                  likeCount:
                    type: integer
                  likedByMe:
                    type: boolean
                  isAuthor:
                    type: boolean
                    description: 현재 조회자가 유효하게 인증된 게시글 작성자인 경우에만 true. 비로그인 및 비작성자는 false.
                  createdAt:
                    type: string
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        storedFileName:
                          type: string
                        contentType:
                          type: string
                        fileUrl:
                          type: string
              example:
                postId: 1
                userName: springUser
                categoryName: Spring
                title: Spring Bean은 무엇인가요?
                content: Spring Bean 개념이 궁금합니다.
                likeCount: 3
                likedByMe: true
                isAuthor: true
                createdAt: '2026-05-12T19:30:00'
                files:
                  - storedFileName: uuid-image.png
                    contentType: image/png
                    fileUrl: /files/uuid-image.png
        '401':
          description: 만료되거나 유효하지 않은 Bearer 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 인증 서비스 장애
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 게시글 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: 존재하는 게시글 ID
          schema:
            type: integer
            format: int64
    patch:
      summary: 게시글 수정
      description: "구현됨.\n\n### Request\r\n\r\n`PATCH /api/posts/{postId}`\r\n\r\n```http\r\nAuthorization: Bearer {accessToken}\r\nContent-Type: multipart/form-data\r\n```\r\n\r\n| Part | 타입 | 필수 | 설명 |\r\n|---|---|---|---|\r\n| categoryId | Long | 필수 | 카테고리 ID |\r\n| title | String | 필수 | 게시글 제목 |\r\n| content | String | 필수 | 게시글 내용 |\r\n| files | MultipartFile[] | 선택 | 첨부파일 목록 |\r\n\r\n### Validation\r\n\r\n| 필드 | 규칙 |\r\n|---|---|\r\n| postId | 필수, 존재하는 게시글 ID |\r\n| categoryId | 필수, 존재하는 카테고리 ID |\r\n| title | 필수, 100자 이하 |\r\n| content | 필수, 5000자 이하 |\r\n| files | 선택, 여러 파일 첨부 가능 |\r\n| files.contentType | `image/jpeg`, `image/png`, `image/webp`, `application/pdf`만 허용 |\r\n| files.size | 0보다 커야 하며 설정된 최대 크기 이하여야 함 |\r\n\r\n### Response\r\n\r\n```json\r\n{\r\n  \"postId\": 1,\r\n  \"categoryId\": 1,\r\n  \"title\": \"수정 게시글 제목\",\r\n  \"content\": \"수정 게시글 내용\",\r\n  \"updatedAt\": \"2026-05-12T19:30:00\"\r\n}\r\n```\r\n\r\n### Status Code\r\n\r\n| 상황 | Status |\r\n|---|---|\r\n| 수정 성공 | 200 OK |\r\n| 인증 실패 | 401 Unauthorized |\r\n| Validation 실패 | 400 Bad Request |\r\n| 허용되지 않은 파일 형식 | 400 Bad Request |\r\n| 빈 파일 | 400 Bad Request |\r\n| 파일 크기 초과 | 400 Bad Request |\r\n| 작성자 불일치 | 403 Forbidden |\r\n| 게시글 없음 | 404 Not Found |\r\n| 카테고리 없음 | 404 Not Found |\r\n| 파일 저장 실패 | 500 Internal Server Error |\r\n\r\n첨부 저장이나 DB 트랜잭션이 롤백되면 이 요청에서 생성한 파일과 부분 파일을 정리한다. 기존 파일은 보존한다. 정리에 실패하거나 트랜잭션 결과를 알 수 없는 경우 파일이 남을 수 있다.\r\n\r\n### 비고\r\n\r\n- 작성자 검증은 Authorization 헤더의 Access Token 사용자 ID와 게시글 작성자 ID를 비교한다.\r\n- 삭제된 게시글은 존재하지 않는 게시글과 동일하게 404 Not Found로 처리하며 게시글과 첨부파일을 변경하지 않는다.\r\n- 게시글 수정 시 `newPost`, `deleted`, `createdAt`, `user`는 변경하지 않는다.\r\n\r\n---"
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  postId:
                    type: integer
                  categoryId:
                    type: integer
                  title:
                    type: string
                  content:
                    type: string
                  updatedAt:
                    type: string
              example:
                postId: 1
                categoryId: 1
                title: 수정 게시글 제목
                content: 수정 게시글 내용
                updatedAt: '2026-05-12T19:30:00'
        '400':
          description: Validation 실패; 허용되지 않은 파일 형식; 빈 파일; 파일 크기 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 작성자 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 게시글 없음; 카테고리 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 파일 저장 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - name: postId
          in: path
          required: true
          description: 존재하고 삭제되지 않은 대상 ID. 상세 규칙은 본문 참고.
          schema:
            type: integer
            format: int64
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - categoryId
                - title
                - content
              properties:
                categoryId:
                  type: integer
                  format: int64
                  description: 존재하는 카테고리 ID
                title:
                  type: string
                  maxLength: 100
                content:
                  type: string
                  maxLength: 5000
                files:
                  type: array
                  description: >-
                    선택, 파일은 0보다 크고 설정된 최대 크기 이하. image/jpeg, image/png, image/webp, application/pdf만
                    허용.
                  items:
                    type: string
                    format: binary
    delete:
      summary: 게시글 삭제
      description: "구현됨.\n\n### Request\r\n\r\n`DELETE /api/posts/{postId}`\r\n\r\n```http\r\nAuthorization: Bearer {accessToken}\r\n```\r\n\r\n### Validation\r\n\r\n| 필드 | 규칙 |\r\n|---|---|\r\n| postId | 필수, 존재하는 게시글 ID, 삭제되지 않은 게시글 |\r\n\r\n### Response\r\n\r\n응답 본문 없음.\r\n\r\n### Status Code\r\n\r\n| 상황 | Status |\r\n|---|---|\r\n| 삭제 성공 | 204 No Content |\r\n| 인증 실패 | 401 Unauthorized |\r\n| 작성자 불일치 | 403 Forbidden |\r\n| 게시글 없음 | 404 Not Found |\r\n\r\n### 비고\r\n\r\n- DB row를 물리 삭제하지 않고 `Post.deleted = true`로 변경한다.\r\n- 이미 삭제된 게시글은 조회되지 않는 게시글로 보고 404 Not Found로 처리한다.\r\n- 삭제 시 `updatedAt`을 갱신한다.\r\n- 작성자 검증은 Authorization 헤더의 Access Token 사용자 ID와 게시글 작성자 ID를 비교한다.\r\n\r\n---"
      responses:
        '204':
          description: 삭제 성공
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 작성자 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 게시글 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - name: postId
          in: path
          required: true
          description: 존재하고 삭제되지 않은 대상 ID. 상세 규칙은 본문 참고.
          schema:
            type: integer
            format: int64
      security:
        - bearerAuth: []
